name: Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Verify project files
        run: |
          pwd
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: infinity-clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
